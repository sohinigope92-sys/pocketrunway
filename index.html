<!DOCTYPE html>
<html>
<head>
<title>PocketRunway</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🌸 PocketRunway</h1>
<p>Your Personal Outfit Planner</p>
</header>

<div class="container">

<div class="card">
<h2>Account Type</h2>
<select id="account">
<option value="">Choose</option>
<option value="buyer">Buyer</option>
<option value="seller">Seller</option>
<option value="flip">Flip (Sell Used Clothes)</option>
</select>
</div>

<div class="card">
<h2>Login / Signup</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="card">
<h2>Budget</h2>
<input type="number" id="budget" placeholder="Enter Any Budget">
</div>

<div class="card">
<h2>Gender</h2>
<select id="gender">
<option value="">Choose</option>
<option value="male">Male</option>
<option value="female">Female</option>
</select>
</div>

<div class="card">
<h2>Occasion</h2>
<select id="occasion">
<option value="">Choose</option>
<option value="wedding">Wedding</option>
<option value="party">Party</option>
<option value="office">Office</option>
<option value="casual">Casual</option>
</select>
</div>

<div class="card">
<h2>Upload Photo</h2>
<input type="file" id="imageInput">
<button onclick="detectSkinTone()">Get Outfit</button>
</div>

<div class="card">
<h2>SmoothBoard</h2>
<button onclick="showBoard()">Try Outfit Ideas</button>
</div>

<div class="card">
<h2>Upload Product (Seller)</h2>
<input type="text" id="product" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<button onclick="addProduct()">Upload</button>
</div>

<div class="card">
<h2>Flip Section ♻️</h2>
<input type="text" id="usedcloth" placeholder="Used Cloth Name">
<input type="number" id="usedprice" placeholder="Selling Price">
<button onclick="flipSell()">Sell Used Cloth</button>
</div>

<div class="card">
<h2>Recommendation</h2>
<p id="result"></p>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
