<!DOCTYPE html>
<html>
<head>
<title>PocketRunway</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌸 PocketRunway</h1>

<div class="box">
<h2>Login / SignUp</h2>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="box">
<h2>Account Type</h2>
<select id="account">
<option>Buyer</option>
<option>Seller</option>
<option>Flip Seller</option>
</select>
</div>

<div class="box">
<h2>Budget</h2>
<input type="number" id="budget" placeholder="₹100 to ₹10,00,000+">
</div>

<div class="box">
<h2>Gender</h2>
<select id="gender">
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="box">
<h2>Occasion</h2>
<select id="occasion">
<option>Wedding</option>
<option>Party</option>
<option>Office</option>
<option>Casual</option>
</select>
</div>

<div class="box">
<h2>Dress Type</h2>
<select id="dress">
<option>Lehenga</option>
<option>Saree</option>
<option>Anarkali</option>
<option>Suit</option>
<option>Gown</option>
</select>
</div>

<div class="box">
<h2>Delivery</h2>
<select id="delivery">
<option>Normal Delivery</option>
<option>Express Delivery</option>
</select>
</div>

<div class="box">
<h2>Pinterest MoodBoard</h2>
<button onclick="moodboard()">Suggest Outfit</button>
</div>

<div class="box">
<h2>Salon / Makeup Booking</h2>
<button onclick="bookSalon()">Book Artist</button>
</div>

<div class="box">
<h2>Seller Upload Product</h2>
<input type="text" id="pname" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<input type="file" id="pimage">
<button onclick="addProduct()">Upload</button>
</div>

<div class="box">
<h2>Flip Section ♻️</h2>
<input type="text" id="usedname" placeholder="Used Cloth">
<input type="number" id="usedprice" placeholder="Selling Price">
<button onclick="sellUsed()">Sell</button>
</div>

<div class="box">
<h2>Rental Option</h2>
<button onclick="rentDress()">Rent Dress</button>
</div>

<h2>Recommendation Box</h2>
<p id="result"></p>

<h2>Products</h2>
<div id="products"></div>

<h2>Cart</h2>
<div id="cart"></div>

<button onclick="payNow()">Proceed To Pay</button>

<p>Collaborations: Nykaa | Myntra | Savanah</p>

<script src="script.js"></script>

</body>
</html>
