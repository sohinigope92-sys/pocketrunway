<!DOCTYPE html>
<html>
<head>
    <title>PocketRunway</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>👗 PocketRunway</h1>
    <p>Smart Outfit Recommendation Platform</p>
</header>

<div class="container">

<div class="card">
<h2>Account Type</h2>
<select id="account">
<option value="">Choose</option>
<option value="buyer">Buyer</option>
<option value="seller">Seller / Business</option>
</select>
</div>

<div class="card">
<h2>Login / Signup</h2>
<input type="text" placeholder="Username" id="username">
<input type="password" placeholder="Password" id="password">
<button onclick="login()">Login</button>
</div>

<div class="card">
<h2>Budget</h2>
<input type="number" id="budget" placeholder="Enter any budget ₹100 - ₹10,00,000">
</div>

<div class="card">
<h2>Gender</h2>
<select id="gender">
<option value="">Choose Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
</select>
</div>

<div class="card">
<h2>Select Occasion</h2>
<select id="occasion">
<option value="">Choose Occasion</option>
<option value="wedding">Wedding</option>
<option value="party">Party</option>
<option value="office">Office</option>
<option value="casual">Casual</option>
</select>
</div>

<div class="card">
<h2>Upload Photo for Skin Tone</h2>
<input type="file" id="imageInput">
<button onclick="detectSkinTone()">Detect Outfit</button>
</div>

<div class="card">
<h2>SmoothBoard (Try Outfit Ideas)</h2>
<button onclick="showBoard()">Show Suggestions</button>
</div>

<div class="card">
<h2>Seller Upload Product</h2>
<input type="text" placeholder="Product Name" id="product">
<input type="number" placeholder="Price" id="price">
<button onclick="addProduct()">Upload Product</button>
</div>

<div class="card">
<h2>Recommendation Result</h2>
<p id="result"></p>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
