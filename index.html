<!DOCTYPE html>
<html>
<head>
<title>PocketRunway</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>PocketRunway</h1>
<p>AI Powered Budget Stylist</p>
</header>

<div class="container">

<h2>Login / Signup</h2>
<input type="text" placeholder="Enter Email">
<input type="password" placeholder="Enter Password">
<button>Login</button>

<hr>

<h2>Select Fashion Category</h2>
<select id="gender">
<option>Female</option>
<option>Male</option>
</select>

<h2>Select Event</h2>
<select id="event">
<option>Wedding</option>
<option>Party</option>
<option>Dance</option>
<option>College Fest</option>
</select>

<h2>Enter Budget</h2>
<select>
<option>500₹</option>
<option>1000₹</option>
<option>5000₹</option>
<option>10000₹</option>
</select>

<h2>Describe Your Aesthetic</h2>
<input type="text" id="mood" placeholder="Royal / Minimal / Pastel">

<button onclick="recommend()">Get Recommendation</button>

<div id="result"></div>

<hr>

<h2>Rent an Outfit</h2>
<select>
<option>Bridal Lehenga</option>
<option>Suit / Sherwani</option>
<option>Anarkali</option>
<option>Blazer Set</option>
</select>
<button>Book for Rent</button>

<hr>

<h2>Book Makeup Artist</h2>
<select>
<option>Bridal Makeup</option>
<option>Party Makeup</option>
<option>HD Makeup</option>
</select>
<button>Book Now</button>

<hr>

<h2>Payment</h2>
<select>
<option>UPI</option>
<option>Card</option>
<option>Cash on Delivery</option>
</select>
<button>Proceed to Pay</button>

<hr>

<h2>Delivery Speed</h2>
<select>
<option>Normal (3-5 Days)</option>
<option>Express (1-2 Days)</option>
</select>

</div>

<script src="script.js"></script>

</body>
</html>
