<!DOCTYPE html>
<html>
<head>
<title>PocketRunway</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>PocketRunway</h1>

<div class="login">
<h2>Login / Signup</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<div class="budget">
<h2>Enter Your Budget</h2>
<input type="number" id="budget" placeholder="Enter any budget ₹100 - ₹10,00,000+">
</div>

<div class="photo">
<h2>Upload Your Photo (Skin Tone Detection)</h2>
<input type="file" id="photoUpload">
<button onclick="detectSkin()">Detect Skin Tone</button>
<p id="skinResult"></p>
</div>

<div class="mood">
<h2>Upload Moodboard</h2>
<input type="file">
</div>

<div class="profession">
<h2>Choose Profession</h2>
<select id="profession">
<option>Wedding</option>
<option>Dance Performance</option>
<option>Office</option>
<option>Party</option>
</select>
</div>

<div class="seller">
<h2>Business Account</h2>
<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<select id="type">
<option>Rent</option>
<option>Sell</option>
</select>
<button onclick="addProduct()">Add Product</button>
</div>

<div class="resell">
<h2>Sell Your Worn Clothes</h2>
<input type="text" id="wornCloth" placeholder="Cloth Name">
<input type="number" id="wornPrice" placeholder="Lower Price">
<button onclick="resell()">Sell</button>
</div>

<script src="script.js"></script>

</body>
</html>
